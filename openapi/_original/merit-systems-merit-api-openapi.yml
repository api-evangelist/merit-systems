      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Amount:
      type: object
      properties:
        raw: { type: string }
        formatted: { type: string }
      required: [raw, formatted]
    UserBalance:
      type: object
      properties:
