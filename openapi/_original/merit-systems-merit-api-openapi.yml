        login: { type: string }
        balance: { $ref: '#/components/schemas/Amount' }
      required: [user_id, login, balance]
    RepoBalance:
      type: object
      properties:
        repo_id: { type: integer }
        owner: { type: string }
        repo: { type: string }
        balance: { $ref: '#/components/schemas/Amount' }
      required: [repo_id, owner, repo, balance]
    OutgoingPayment:
      type: object
      properties:
        type:
          type: string
          enum: [UserPayment, RepoFund]
        sender_id: { type: integer }
