aid: merit-systems
name: Merit Systems
description: >-
  Merit Systems builds the infrastructure for open agentic commerce — the
  discovery and payment rails that let AI agents find and pay for the APIs,
  data, and services they need. Merit originated the "open agentic commerce"
  framing and the x402 ecosystem index (x402scan), and ships a developer stack
  for pay-per-call APIs: AgentCash (an MCP server, CLI, and USDC wallet that
  lets any agent call payment-protected APIs over x402/MPP micropayments),
  @agentcash/router (a framework for building x402/MPP-compatible endpoints),
  the Echo "User Pays" AI SDK, and the Merit Terminal financial stack for
  funding open-source contributors and repositories. Backed by a $10M seed
  round led by a16z and Blockchain Capital.
